{% extends "base.html" %}
{#- After a CAPTCHA CPPP did not accept. The usual path is the box on the tender page. #}
{% block content %}<div class=backlink><a href="/t/{{ t.id }}">{{ icon('caret-left') }}Back to this tender</a></div>
<h1>Open tender details</h1>
<p class=lede>{{ t.title }}</p>
{% if captcha.message %}<p class=hint role=alert>{{ captcha.message }}</p>{% endif %}
<form method=post action="/t/{{ t.id }}/cppp">
 <input type=hidden name=state value="{{ captcha.state }}">
 <p><img src="{{ captcha.image }}" alt="CAPTCHA image from CPPP"></p>
 <div class=f><label for=captcha>Type the characters in the image</label>
  <input id=captcha name=captcha required maxlength=20 autocomplete=off
         autocapitalize=off spellcheck=false autofocus></div>
 <p><button class="btn primary" type=submit>Open tender details</button></p>
</form>{% endblock %}
