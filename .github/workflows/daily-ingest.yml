# Daily ingest of everything that will talk to a hosted runner.
#
# NOT GeM. bidplus.gem.gov.in answers "connection refused" at the socket to this
# runner's address -- not a 403, not a CAPTCHA, no TCP session at all -- so six
# parallel shards here failed inside a minute without reading a byte. Its bid
# PDFs are on the same host, so enrichment of GeM rows cannot run here either.
# GeM reaches a residential connection, and only the scheduled task on the
# operator's machine (daily_ingest.cmd) fetches it. That task is not a fallback
# for this workflow; it is the only path to two thirds of the corpus.
#
# What this does cover: CPPP and the 20 GePNIC state portals, which answer a
# datacenter address perfectly well -- better than the laptop, in fact, where
# several of them had been returning nothing for days.
name: daily-ingest

on:
  schedule:
    # 03:00 UTC / 08:30 IST. Deliberately not 01:00 UTC, which is when Vercel's
    # own /cron/ingest runs CPPP -- two crawls of the same listing at once earns
    # a rate limit and gains nothing.
    - cron: "0 3 * * *"
  workflow_dispatch:      # so a missed day can be made up without waiting

concurrency:
  # Two ingests writing at once would crawl the same pages twice for no gain.
  # Never cancel a run in flight: rows commit in batches, but a half-finished
  # GeM crawl leaves the deepest pages unread.
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # CPPP is the long leg at ~10 minutes; the 20 state portals are mostly empty
    # but each pays its 3s rate limit. Bounded so a wedged connector cannot burn
    # a whole runner day.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # apscheduler is not in requirements.txt on purpose (Vercel must not
      # install it), but app/scheduler.py imports it even for a one-shot run.
      - run: pip install -r requirements.txt apscheduler

      - name: Ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          # Matches production. app/retention.py deletes nothing when unset, so
          # leaving it out would quietly stop the purge this job is meant to run.
          RETENTION_DAYS: "0"
          # GeM is refused from here and its PDFs with it, so both its crawl and
          # its share of enrichment are skipped rather than spending the run
          # timing out against a host that will not answer. The machine that can
          # reach GeM does that work.
          SKIP_CONNECTORS: GeM
          ENRICH_SKIP_SOURCES: GeM
        run: python -u run_prod_worker.py --once
