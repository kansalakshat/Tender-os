# Daily check of the Neon free plan. Fails -- and GitHub emails the repository
# owner -- when the database refuses connections (a limit was hit) or storage is
# mostly spent. See neon_usage.py. Needs the NEON_API_KEY repository secret.
name: neon-usage

on:
  schedule:
    - cron: "30 4 * * *"      # 10:00 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  usage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "psycopg[binary]"
      - env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: proud-frog-59492291
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python neon_usage.py
