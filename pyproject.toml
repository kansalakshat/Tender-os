[project]
name = "tender-aggregator"
version = "0.1.0"
description = "Compliant aggregator for public Indian government tender/procurement data"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "httpx>=0.28",
    "selectolax>=0.3.21",
    "apscheduler>=3.10",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.setuptools]
packages = ["app", "app.connectors"]

[project.scripts]
tenders = "app.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
