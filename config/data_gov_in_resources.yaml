# data.gov.in datasets to ingest, pinned by resource id.
#
# THIS LIST IS THE ALLOWLIST. Nothing is ingested that is not named here.
#
# Keyword discovery deliberately does NOT auto-ingest, because searching the
# catalogue for "tender" and "procurement" is wildly imprecise on this platform:
#   - "tender" matches "Variety-wise Daily Market Prices of TENDER COCONUT"
#   - "procurement" matches paddy/wheat/coarsegrain crop procurement under MSP
# Of 242 datasets matching "procurement", the ones below were the genuine public
# procurement records. Ingesting the rest would fill the tenders table with
# vegetable prices.
#
# To find candidates:  tenders discover-data-gov-in
# Then read each one's title and fields, and paste the good ones here.

resources:
  # Assam public procurement, published as OCDS (Open Contracting Data Standard).
  # Fields: tender/id, tender/title, tender/value/amount, tender/datePublished,
  # tender/status, tender/mainProcurementCategory, buyer/name.
