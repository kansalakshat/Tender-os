  - domain: bidplus.gem.gov.in
    name: GeM
    license: public-published
    robots_verified_on: 2026-09-16
    verified_by: operator-authorised (nirmaanos35@gmail.com)
    paths: ["/all-bids", "/showbidDocument/"]
    notes: >
      Government e-Marketplace bid listing. robots.txt (fetched on the date above)
      disallows only /resources/ and three /bg_emd/epbgservice/ endpoints;
      /all-bids and /showbidDocument/<id> are both permitted, confirmed with
      RobotFileParser. Neither page carries a CAPTCHA: /all-bids renders its list
      client-side and the bid PDF answers an unauthenticated GET. The listing is
      read with Playwright because the rows arrive via an in-page POST that
      carries its own CSRF token -- the browser issues that request itself, so no
      token is replayed and no anti-bot measure is evaded. 43,646 bids live as of
      the verification date.
